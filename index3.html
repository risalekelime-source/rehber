<!doctype html>
<html lang="tr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DDH Rehber</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Rehber">
    <meta name="theme-color" content="#f2f2f7">

    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: #e9e9ee;
            margin: 0;
            overscroll-behavior-y: contain;
        }
        input:focus { outline: none; }
        ::-webkit-scrollbar { width: 0; height: 0; }
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

        #app { height: 100dvh; width: 100%; }

        /* Büyük başlık arama yapınca kompakt hale gelir (üst kısım hep görünür) */
        #bigHeader { max-height: 120px; overflow: hidden; transition: max-height .25s ease, opacity .2s ease, padding .25s ease; }
        #app.searching #bigHeader { max-height: 0; opacity: 0; padding-top: 0; padding-bottom: 0; }
        #compactHeader { max-height: 0; opacity: 0; overflow: hidden; transition: max-height .25s ease, opacity .2s ease; }
        #app.searching #compactHeader { max-height: 60px; opacity: 1; }

        .card-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.25; }

        .seg-btn { transition: all .2s ease; }
        .seg-btn.active { background: #1c1c1e; color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.18); }

        .admin-tab.active { background: #007aff; color: #fff; }

        input::placeholder { color: #8e8e93; }
    </style>
<base target="_blank">
</head>
<body>
<div id="app" class="w-full flex justify-center">
    <div class="w-full max-w-5xl h-full flex flex-col relative overflow-hidden bg-[#f2f2f7] shadow-2xl">

        <!-- ============ ANA EKRAN ============ -->
        <div id="viewMain" class="h-full flex flex-col">

            <!-- Büyük başlık -->
            <div id="bigHeader" class="flex-shrink-0 px-6 pt-12 pb-2 safe-top flex items-end justify-between">
                <div>
                    <h2 class="font-bold text-3xl text-[#1c1c1e] tracking-tight">Rehber</h2>
                    <div id="contactCount" class="text-xs text-[#8e8e93] font-bold mt-1 uppercase tracking-wider">Yükleniyor...</div>
                </div>
                <button id="btnLock" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-[#8e8e93] active:scale-95 transition" title="Yönetim">
                    <i data-lucide="lock" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Kompakt başlık (arama yaparken) -->
            <div id="compactHeader" class="flex-shrink-0 px-6 pt-4 pb-1 safe-top flex items-center justify-between">
                <div id="compactCount" class="text-xs text-[#8e8e93] font-bold uppercase tracking-wider"></div>
                <button id="btnLock2" class="w-8 h-8 rounded-full bg-white shadow-sm flex items-center justify-center text-[#8e8e93] active:scale-95 transition">
                    <i data-lucide="lock" class="w-3.5 h-3.5"></i>
                </button>
            </div>

            <!-- Liste seçim sekmeleri -->
            <div class="flex-shrink-0 px-5 pt-2 pb-2">
                <div class="flex bg-[#e3e3e8] rounded-xl p-1 gap-1">
                    <button data-list="vatandas" class="seg-btn active flex-1 py-2 rounded-lg text-sm font-bold text-[#1c1c1e]">Vatandaş</button>
                    <button data-list="personel" class="seg-btn flex-1 py-2 rounded-lg text-sm font-bold text-[#1c1c1e]">Personel</button>
                    <button data-list="santral" class="seg-btn flex-1 py-2 rounded-lg text-sm font-bold text-[#1c1c1e]">Santral</button>
                </div>
            </div>

            <!-- Liste Alanı -->
            <div id="contactList" class="flex-1 overflow-y-auto min-h-0">
                <div id="listContent" class="grid grid-cols-1 md:grid-cols-2 gap-x-2 gap-y-0 content-start pb-44"></div>
            </div>

            <!-- Arama Çubuğu -->
            <div id="searchBar" class="absolute bottom-0 left-0 right-0 px-5 pb-8 pt-4 bg-[#f2f2f7]/80 backdrop-blur-xl border-t border-[#d1d1d6] safe-bottom will-change-transform">
                <div class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-[#e3e3e8]">
                    <i data-lucide="search" class="w-4 h-4 text-[#8e8e93] shrink-0"></i>
                    <input id="searchInput" type="search" autocomplete="off" enterkeyhint="search"
                           placeholder="İsim veya numara ara..." class="bg-transparent flex-1 text-base text-[#1c1c1e] outline-none">
                    <button id="btnClear" class="hidden w-6 h-6 rounded-full bg-[#c7c7cc] text-white items-center justify-center shrink-0">
                        <i data-lucide="x" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- ============ ŞİFRE EKRANI ============ -->
        <div id="viewLogin" class="hidden h-full flex-col items-center justify-center px-8 bg-[#f2f2f7] absolute inset-0 z-30">
            <div class="w-16 h-16 rounded-2xl bg-[#1c1c1e] flex items-center justify-center mb-5">
                <i data-lucide="shield-check" class="w-8 h-8 text-white"></i>
            </div>
            <h2 class="font-bold text-2xl text-[#1c1c1e] mb-1">Yönetim Girişi</h2>
            <p class="text-sm text-[#8e8e93] mb-6">Devam etmek için şifreyi girin</p>
            <input id="passInput" type="password" placeholder="Şifre" enterkeyhint="done"
                   class="w-full max-w-xs px-4 py-3 rounded-xl bg-white text-center text-lg font-semibold tracking-widest shadow-sm border border-[#d1d1d6] focus:border-[#007aff]">
            <p id="passError" class="hidden text-sm text-[#ff3b30] font-semibold mt-3">Hatalı şifre, tekrar deneyin.</p>
            <button id="btnLogin" class="mt-4 w-full max-w-xs py-3 rounded-xl bg-[#007aff] text-white font-bold active:scale-[0.98] transition">Giriş Yap</button>
            <button id="btnLoginBack" class="mt-3 text-sm text-[#8e8e93] font-semibold py-2">Vazgeç</button>
        </div>

        <!-- ============ YÖNETİM EKRANI ============ -->
        <div id="viewAdmin" class="hidden h-full flex-col bg-[#f2f2f7] absolute inset-0 z-30">
            <div class="flex-shrink-0 px-6 pt-12 pb-3 safe-top flex items-center justify-between border-b border-[#d1d1d6] bg-[#f2f2f7]">
                <div>
                    <h2 class="font-bold text-2xl text-[#1c1c1e]">Yönetim</h2>
                    <div class="text-xs text-[#8e8e93] font-bold mt-0.5 uppercase tracking-wider">Ekle • Düzenle • Sil</div>
                </div>
                <button id="btnAdminBack" class="w-10 h-10 rounded-full bg-white shadow-sm flex items-center justify-center text-[#1c1c1e] active:scale-95 transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto min-h-0 px-5 py-4 pb-10">
                <!-- Ekleme / düzenleme formu -->
                <div class="bg-white rounded-2xl p-4 shadow-sm mb-4">
                    <div id="formTitle" class="font-bold text-[#1c1c1e] mb-3 flex items-center gap-2">
                        <i data-lucide="user-plus" class="w-4 h-4 text-[#007aff]"></i> Yeni Kayıt Ekle
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <input id="fName" type="text" placeholder="Ad Soyad / Unvan" class="px-4 py-2.5 rounded-xl bg-[#f2f2f7] text-[15px] font-medium border border-transparent focus:border-[#007aff]">
                        <input id="fPhone" type="text" placeholder="Dahili / Numara" class="px-4 py-2.5 rounded-xl bg-[#f2f2f7] text-[15px] font-medium border border-transparent focus:border-[#007aff]">
                    </div>
                    <div class="flex bg-[#e3e3e8] rounded-xl p-1 gap-1 mt-3" id="adminTabs">
                        <button data-list="vatandas" class="admin-tab active flex-1 py-1.5 rounded-lg text-xs font-bold text-[#1c1c1e]">Vatandaş</button>
                        <button data-list="personel" class="admin-tab flex-1 py-1.5 rounded-lg text-xs font-bold text-[#1c1c1e]">Personel</button>
                        <button data-list="santral" class="admin-tab flex-1 py-1.5 rounded-lg text-xs font-bold text-[#1c1c1e]">Santral</button>
                    </div>
                    <div class="flex gap-2 mt-3">
                        <button id="btnSave" class="flex-1 py-2.5 rounded-xl bg-[#007aff] text-white font-bold text-sm active:scale-[0.98] transition">Kaydet</button>
                        <button id="btnCancelEdit" class="hidden px-5 py-2.5 rounded-xl bg-[#e3e3e8] text-[#1c1c1e] font-bold text-sm">Vazgeç</button>
                    </div>
                </div>

                <!-- Dışa / içe aktarım -->
                <div class="grid grid-cols-2 gap-2 mb-4">
                    <button id="btnExport" class="py-2.5 rounded-xl bg-white shadow-sm text-[#1c1c1e] font-bold text-xs flex items-center justify-center gap-1.5 active:scale-[0.98] transition">
                        <i data-lucide="download" class="w-3.5 h-3.5 text-[#007aff]"></i> TXT İndir
                    </button>
                    <label class="py-2.5 rounded-xl bg-white shadow-sm text-[#1c1c1e] font-bold text-xs flex items-center justify-center gap-1.5 active:scale-[0.98] transition cursor-pointer">
                        <i data-lucide="upload" class="w-3.5 h-3.5 text-[#34c759]"></i> TXT Yükle
                        <input id="btnImport" type="file" accept=".txt,.csv" class="hidden">
                    </label>
                </div>

                <!-- Santral numarası + şifre -->
                <div class="bg-white rounded-2xl p-4 shadow-sm mb-4">
                    <div class="font-bold text-[#1c1c1e] mb-3 text-sm flex items-center gap-2">
                        <i data-lucide="settings" class="w-4 h-4 text-[#8e8e93]"></i> Ayarlar
                    </div>
                    <div class="flex items-center gap-2 mb-3">
                        <input id="fSantral" type="text" placeholder="Santral no (örn: 03267121719)" class="flex-1 px-4 py-2 rounded-xl bg-[#f2f2f7] text-sm font-medium">
                        <button id="btnSaveSantral" class="px-4 py-2 rounded-xl bg-[#1c1c1e] text-white text-xs font-bold">Kaydet</button>
                    </div>
                    <div class="flex items-center gap-2">
                        <input id="fNewPass" type="password" placeholder="Yeni yönetim şifresi" class="flex-1 px-4 py-2 rounded-xl bg-[#f2f2f7] text-sm font-medium">
                        <button id="btnSavePass" class="px-4 py-2 rounded-xl bg-[#1c1c1e] text-white text-xs font-bold">Kaydet</button>
                    </div>
                </div>

                <!-- Kayıt listesi -->
                <div class="flex bg-[#e3e3e8] rounded-xl p-1 gap-1 mb-3" id="adminListTabs">
                    <button data-list="vatandas" class="admin-tab active flex-1 py-1.5 rounded-lg text-xs font-bold text-[#1c1c1e]">Vatandaş</button>
                    <button data-list="personel" class="admin-tab flex-1 py-1.5 rounded-lg text-xs font-bold text-[#1c1c1e]">Personel</button>
                    <button data-list="santral" class="admin-tab flex-1 py-1.5 rounded-lg text-xs font-bold text-[#1c1c1e]">Santral</button>
                </div>
                <div class="text-xs text-[#8e8e93] font-bold uppercase tracking-wider mb-2 px-1" id="adminCount"></div>
                <div id="adminEntries" class="space-y-2"></div>
            </div>
        </div>

    </div>
</div>

<script>
/* ==================== AYARLAR & VERİ ==================== */
const LISTS = {
    vatandas: { title: 'Vatandaş', file: 'vatandas.txt' },
    personel: { title: 'Personel', file: 'personel.txt' },
    santral:  { title: 'Santral',  file: 'santral.txt' }
};

// Dosya bulunamazsa kullanılacak örnek veriler
const DEFAULT_DATA = {
    vatandas: [
        { id: 1, name: 'Ahmet Yılmaz',    phone: '101' },
        { id: 2, name: 'Ayşe Demir',      phone: '102' },
        { id: 3, name: 'Mehmet Kaya',     phone: '103' },
        { id: 4, name: 'Fatma Şahin',     phone: '104' },
        { id: 5, name: 'Mustafa Çelik',   phone: '105' }
    ],
    personel: [
        { id: 1, name: 'Dr. Ali Vefa',        phone: '201' },
        { id: 2, name: 'Hemşire Elif Su',     phone: '202' },
        { id: 3, name: 'Personel Zeynep Kılıç', phone: '203' }
    ],
    santral: [
        { id: 1, name: 'Acil Servis',        phone: '112' },
        { id: 2, name: 'Ambulans',           phone: '112' },
        { id: 3, name: 'Numune Hastanesi',   phone: '03267121719' }
    ]
};

let data = { vatandas: [], personel: [], santral: [] };
let currentList = 'vatandas';
let adminList   = 'vatandas';
let editId      = null;
let uid         = 1000;

const app         = document.getElementById('app');
const listContent = document.getElementById('listContent');
const contactList = document.getElementById('contactList');
const searchInput = document.getElementById('searchInput');
const fitCtx      = document.createElement('canvas').getContext('2d');

/* ==================== YARDIMCILAR ==================== */
function normalizeText(text) {
    return text.toString().normalize('NFD').replace(/[\u0300-\u036f]/g, "")
        .replace(/İ/g, "i").replace(/I/g, "i").replace(/ı/g, "i")
        .toLowerCase()
        .replace(/[ğ]/g, "g").replace(/[ü]/g, "u").replace(/[ş]/g, "s")
        .replace(/[ö]/g, "o").replace(/[ç]/g, "c");
}

function getAvatarColor(name) {
    const colors = ['#007aff','#34c759','#ff3b30','#ff9500','#af52de','#5856d6','#ff2d55'];
    let hash = 0;
    for (let i = 0; i < (name || "").length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
    return colors[Math.abs(hash) % colors.length];
}

function parseTxt(text) {
    return text.split('\n')
        .map(l => l.trim())
        .filter(l => l.includes(';'))
        .map(l => {
            const parts = l.split(';');
            return { id: ++uid, name: (parts[0] || '').trim(), phone: (parts[1] || '').trim() };
        });
}

function toTxt(rows) {
    return rows.map(r => `${r.name};${r.phone}`).join('\n') + '\n';
}

function getSantralNo() {
    return localStorage.getItem('ddh_santral') || '03267121719';
}

function saveList(key) {
    // Veritabanı yok: düzenlemeler tarayıcıda (localStorage) saklanır,
    // "TXT İndir" ile gerçek txt dosyası olarak dışa aktarılır.
    localStorage.setItem('ddh_' + key, JSON.stringify(data[key]));
}

/* ==================== VERİ YÜKLEME ==================== */
async function loadList(key) {
    // 1) Önce aynı klasördeki txt/csv dosyasını dene
    let rows = null;
    try {
        const r = await fetch(LISTS[key].file + '?t=' + Date.now());
        if (r.ok) rows = parseTxt(await r.text());
    } catch (e) { /* dosya yok, sorun değil */ }

    // 2) Daha önce yönetimden yapılan düzenlemeler varsa onlar öncelikli
    const local = localStorage.getItem('ddh_' + key);
    if (local) { try { rows = JSON.parse(local); } catch (e) {} }

    // 3) Hiçbiri yoksa gömülü örnek veriler
    data[key] = rows && rows.length ? rows : (DEFAULT_DATA[key] || []);
}

async function loadAll() {
    await Promise.all(Object.keys(LISTS).map(loadList));
    document.getElementById('fSantral').value = getSantralNo();
    renderList();
}

/* ==================== ANA LİSTE ==================== */
// Uzun isimler için kart genişliğine göre otomatik yazı boyutu
function fitFontSize(name, maxWidth, base = 17, min = 11) {
    let size = base;
    while (size > min) {
        fitCtx.font = `700 ${size}px 'DM Sans', sans-serif`;
        if (fitCtx.measureText(name).width <= maxWidth) break;
        size -= 0.5;
    }
    return size;
}

function renderList() {
    const raw = searchInput.value;
    const q = normalizeText(raw);
    const isSantral = currentList === 'santral';
    const santralNo = getSantralNo();

    const filtered = data[currentList].filter(c => {
        const nameMatch  = normalizeText(c.name).includes(q);
        const phoneMatch = (c.phone || '').toString().includes(q);
        return nameMatch || phoneMatch;
    }).sort((a, b) => a.name.localeCompare(b.name, 'tr'));

    const countText = `${filtered.length} KAYIT • ${LISTS[currentList].title.toUpperCase()}`;
    document.getElementById('contactCount').textContent  = countText;
    document.getElementById('compactCount').textContent  = countText;

    const cardMaxNameWidth = Math.max(140, Math.min(listContent.clientWidth, 768) - 150);

    let html = '';
    let lastLetter = '';
    filtered.forEach(c => {
        const letter = (c.name[0] || '#').toUpperCase();
        if (letter !== lastLetter) {
            html += `<div class="col-span-full px-2 pt-3 pb-1 text-xs font-bold text-[#8e8e93] sticky top-0 bg-[#f2f2f7]/95 backdrop-blur-sm z-10">${letter}</div>`;
            lastLetter = letter;
        }
        const tel = isSantral ? `tel:${c.phone}` : `tel:${santralNo},,${c.phone}`;
        const phoneLabel = isSantral ? 'Numara' : 'Dahili';
        html += `
            <a href="${tel}" class="block bg-white mx-2 my-1 rounded-2xl shadow-sm active:scale-[0.98] transition-transform no-underline">
                <div class="flex items-center gap-4 p-4">
                    <div class="w-11 h-11 rounded-full flex items-center justify-center text-white font-bold text-lg shrink-0" style="background:${getAvatarColor(c.name)}">
                        ${(c.name.charAt(0) || '?').toUpperCase()}
                    </div>
                    <div class="min-w-0 flex-1">
                        <div class="card-name text-[#1c1c1e] font-bold" data-name="${c.name.replace(/"/g,'&quot;')}" style="font-size:17px">${c.name}</div>
                        <div class="text-[#8e8e93] text-[14px] mt-0.5 font-medium italic">${phoneLabel}: ${c.phone}</div>
                    </div>
                    <div class="ml-auto text-[#34c759] shrink-0">
                        <i data-lucide="phone-forwarded" class="w-5 h-5"></i>
                    </div>
                </div>
            </a>`;
    });

    listContent.innerHTML = html ||
        '<div class="col-span-full p-10 text-center text-[#8e8e93]">Eşleşme bulunamadı</div>';

    // İsim uzunluğuna göre yazı boyutlarını ayarla
    listContent.querySelectorAll('.card-name').forEach(el => {
        el.style.fontSize = fitFontSize(el.dataset.name, cardMaxNameWidth) + 'px';
    });

    lucide.createIcons();
}

/* ==================== ARAMA (üst kısım hep görünür) ==================== */
function onSearch() {
    const has = searchInput.value.length > 0;
    app.classList.toggle('searching', has);
    document.getElementById('btnClear').classList.toggle('hidden', !has);
    document.getElementById('btnClear').classList.toggle('flex', has);
    contactList.scrollTop = 0;   // aramada liste en üstten başlar
    renderList();
}
searchInput.addEventListener('input', onSearch);
searchInput.addEventListener('focus', onSearch);
document.getElementById('btnClear').addEventListener('click', () => {
    searchInput.value = '';
    onSearch();
    searchInput.focus();
});

// Mobil klavye açılınca arama çubuğu klavyenin üstünde kalır
if (window.visualViewport) {
    const bar = document.getElementById('searchBar');
    const vv = window.visualViewport;
    const fixBar = () => {
        const kb = window.innerHeight - vv.height - vv.offsetTop;
        bar.style.transform = kb > 0 ? `translateY(${-kb}px)` : '';
    };
    vv.addEventListener('resize', fixBar);
    vv.addEventListener('scroll', fixBar);
}

/* ==================== SEKMELER ==================== */
document.querySelectorAll('#viewMain .seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        currentList = btn.dataset.list;
        document.querySelectorAll('#viewMain .seg-btn').forEach(b => b.classList.toggle('active', b === btn));
        searchInput.value = '';
        app.classList.remove('searching');
        onSearch();
    });
});

/* ==================== ŞİFRE / YÖNETİM ==================== */
function getPass() { return localStorage.getItem('ddh_pass') || 'ddh2024'; }

function show(view) {
    ['viewMain','viewLogin','viewAdmin'].forEach(id => {
        const el = document.getElementById(id);
        if (id === 'viewMain') { el.classList.remove('hidden'); el.classList.add('flex'); }
        else { el.classList.toggle('hidden', id !== view); el.classList.toggle('flex', id === view); }
    });
    lucide.createIcons();
}

function openLogin() {
    document.getElementById('passInput').value = '';
    document.getElementById('passError').classList.add('hidden');
    show('viewLogin');
    setTimeout(() => document.getElementById('passInput').focus(), 100);
}
document.getElementById('btnLock').addEventListener('click', openLogin);
document.getElementById('btnLock2').addEventListener('click', openLogin);
document.getElementById('btnLoginBack').addEventListener('click', () => show('viewMain'));

function tryLogin() {
    if (document.getElementById('passInput').value === getPass()) {
        show('viewAdmin');
        renderAdmin();
    } else {
        document.getElementById('passError').classList.remove('hidden');
    }
}
document.getElementById('btnLogin').addEventListener('click', tryLogin);
document.getElementById('passInput').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
document.getElementById('btnAdminBack').addEventListener('click', () => { show('viewMain'); renderList(); });

/* ==================== YÖNETİM İŞLEMLERİ ==================== */
function setAdminTabs(containerId, activeKey) {
    document.querySelectorAll('#' + containerId + ' .admin-tab').forEach(b =>
        b.classList.toggle('active', b.dataset.list === activeKey));
}
document.querySelectorAll('#adminTabs .admin-tab, #adminListTabs .admin-tab').forEach(btn => {
    btn.addEventListener('click', () => {
        adminList = btn.dataset.list;
        setAdminTabs('adminTabs', adminList);
        setAdminTabs('adminListTabs', adminList);
        renderAdmin();
    });
});

function renderAdmin() {
    const rows = [...data[adminList]].sort((a, b) => a.name.localeCompare(b.name, 'tr'));
    document.getElementById('adminCount').textContent =
        `${rows.length} kayıt • ${LISTS[adminList].title}`;
    document.getElementById('adminEntries').innerHTML = rows.map(c => `
        <div class="bg-white rounded-2xl p-3 shadow-sm flex items-center gap-3">
            <div class="w-9 h-9 rounded-full flex items-center justify-center text-white font-bold text-sm shrink-0" style="background:${getAvatarColor(c.name)}">
                ${(c.name.charAt(0) || '?').toUpperCase()}
            </div>
            <div class="min-w-0 flex-1">
                <div class="font-bold text-[#1c1c1e] text-[15px] truncate">${c.name}</div>
                <div class="text-[#8e8e93] text-[13px] font-medium italic">${c.phone}</div>
            </div>
            <button data-edit="${c.id}" class="w-9 h-9 rounded-xl bg-[#f2f2f7] flex items-center justify-center text-[#007aff] active:scale-95 transition shrink-0">
                <i data-lucide="pencil" class="w-4 h-4"></i>
            </button>
            <button data-del="${c.id}" class="w-9 h-9 rounded-xl bg-[#f2f2f7] flex items-center justify-center text-[#ff3b30] active:scale-95 transition shrink-0">
                <i data-lucide="trash-2" class="w-4 h-4"></i>
            </button>
        </div>`).join('') || '<div class="p-8 text-center text-[#8e8e93] text-sm">Bu listede kayıt yok.</div>';

    document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', () => {
        const row = data[adminList].find(r => r.id == b.dataset.del);
        if (row && confirm(`"${row.name}" silinsin mi?`)) {
            data[adminList] = data[adminList].filter(r => r.id != b.dataset.del);
            saveList(adminList);
            renderAdmin();
        }
    }));
    document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', () => {
        const row = data[adminList].find(r => r.id == b.dataset.edit);
        if (!row) return;
        editId = row.id;
        document.getElementById('fName').value = row.name;
        document.getElementById('fPhone').value = row.phone;
        document.getElementById('formTitle').innerHTML = '<i data-lucide="pencil" class="w-4 h-4 text-[#007aff]"></i> Kayıt Düzenleniyor';
        document.getElementById('btnCancelEdit').classList.remove('hidden');
        lucide.createIcons();
        document.getElementById('fName').focus();
    }));
    lucide.createIcons();
}

document.getElementById('btnSave').addEventListener('click', () => {
    const name = document.getElementById('fName').value.trim();
    const phone = document.getElementById('fPhone').value.trim();
    if (!name || !phone) { alert('Ad ve numara boş bırakılamaz.'); return; }
    if (editId) {
        const row = data[adminList].find(r => r.id === editId);
        if (row) { row.name = name; row.phone = phone; }
    } else {
        data[adminList].push({ id: ++uid, name, phone });
    }
    saveList(adminList);
    cancelEdit();
    renderAdmin();
});

function cancelEdit() {
    editId = null;
    document.getElementById('fName').value = '';
    document.getElementById('fPhone').value = '';
    document.getElementById('formTitle').innerHTML = '<i data-lucide="user-plus" class="w-4 h-4 text-[#007aff]"></i> Yeni Kayıt Ekle';
    document.getElementById('btnCancelEdit').classList.add('hidden');
    lucide.createIcons();
}
document.getElementById('btnCancelEdit').addEventListener('click', cancelEdit);

/* ---- TXT / CSV dışa aktar ---- */
document.getElementById('btnExport').addEventListener('click', () => {
    const blob = new Blob([toTxt(data[adminList])], { type: 'text/plain;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = LISTS[adminList].file;
    a.click();
    URL.revokeObjectURL(a.href);
});

/* ---- TXT / CSV içe aktar ---- */
document.getElementById('btnImport').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    const reader = new FileReader();
    reader.onload = () => {
        const rows = parseTxt(reader.result.toString());
        if (!rows.length) { alert('Dosyada "İsim;Numara" formatında satır bulunamadı.'); return; }
        if (confirm(`${rows.length} kayıt "${LISTS[adminList].title}" listesine yüklensin mi? Mevcut kayıtların üzerine yazılır.`)) {
            data[adminList] = rows;
            saveList(adminList);
            renderAdmin();
        }
    };
    reader.readAsText(f, 'UTF-8');
    e.target.value = '';
});

/* ---- Ayarlar: santral no + şifre ---- */
document.getElementById('btnSaveSantral').addEventListener('click', () => {
    const v = document.getElementById('fSantral').value.trim();
    if (v) { localStorage.setItem('ddh_santral', v); alert('Santral numarası kaydedildi.'); }
});
document.getElementById('btnSavePass').addEventListener('click', () => {
    const v = document.getElementById('fNewPass').value;
    if (v.length < 4) { alert('Şifre en az 4 karakter olmalı.'); return; }
    localStorage.setItem('ddh_pass', v);
    document.getElementById('fNewPass').value = '';
    alert('Yönetim şifresi değiştirildi.');
});

/* ==================== BAŞLAT ==================== */
loadAll();
lucide.createIcons();
</script>
</body>
</html>
