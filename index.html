<!doctype html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>DDH Rehber</title>

    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Rehber">
    <meta name="theme-color" content="#f2f2f7">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="https://cdn.tailwindcss.com/3.4.1"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
        
        /* Mobil dikeyde tam ekran sığma ve taşmayı önleme ayarları */
        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #e5e5ea;
            font-family: 'DM Sans', sans-serif;
            position: fixed;
        }

        input:focus { outline: none; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #d1d1d6; border-radius: 4px; }
        
        .safe-top { padding-top: env(safe-area-inset-top); }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
    <div id="app" class="absolute inset-0 w-full h-full md:max-w-2xl md:mx-auto md:my-auto md:h-[90vh] md:rounded-3xl md:shadow-2xl flex flex-col overflow-hidden bg-[#f2f2f7]">
        
        <!-- Üst Başlık (Sabit Yükseklik) -->
        <div class="flex-shrink-0 px-4 pt-2.5 pb-1.5 safe-top bg-[#f2f2f7]/95 backdrop-blur-md z-20 flex justify-between items-center border-b border-[#d1d1d6]/50">
            <div>
                <h2 class="font-bold text-base md:text-lg text-[#1c1c1e] tracking-tight">Rehber5</h2>
                <div id="contactCount" class="text-[9px] text-[#8e8e93] font-bold uppercase tracking-wider">Yükleniyor...</div>
            </div>
            <button onclick="loadData()" class="p-1.5 rounded-full bg-[#e3e3e8] text-[#1c1c1e] hover:bg-[#d1d1d6] transition active:scale-95 flex items-center justify-center" title="Yenile">
                <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
            </button>
        </div>

        <!-- Liste Alanı (Dikeyde kalan esnek alan, kendi içinde kaydırılabilir) -->
        <div id="contactList" class="flex-1 min-h-0 overflow-y-auto pt-1 pb-2">
            <div id="listContent" class="space-y-1.5 px-3"></div>
        </div>

        <!-- Arama Çubuğu (Sabit Alt Kısım) -->
        <div class="flex-shrink-0 px-3 py-2 bg-[#f2f2f7]/95 backdrop-blur-xl border-t border-[#d1d1d6] safe-bottom z-30">
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-[#e3e3e8]">
                <i data-lucide="search" class="w-4 h-4 text-[#8e8e93]"></i>
                <input id="searchInput" type="text" placeholder="İsim, kat veya dahili numara ara..." class="bg-transparent flex-1 text-xs md:text-sm text-[#1c1c1e] outline-none">
            </div>
        </div>

    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((reg) => console.log('SW kayıt başarılı:', reg.scope))
                    .catch((err) => console.log('SW kayıt hatası:', err));
            });
        }

        let contacts = [];
        const sabitSantralNo = "03267121719"; 

        async function loadData() {
            document.getElementById('contactCount').textContent = "YÜKLENİYOR...";
            try {
                const response = await fetch('rehber.txt?t=' + Date.now());
                if (!response.ok) throw new Error("rehber.txt dosyası bulunamadı!");
                const text = await response.text();
                
                contacts = text.split('\n')
                    .filter(line => line.trim().includes(';'))
                    .map(line => {
                        let [rawName, phone] = line.split(';');
                        rawName = rawName.trim();
                        phone = phone.trim();

                        let name = rawName;
                        let detail = "";
                        if (rawName.includes(' - ')) {
                            const parts = rawName.split(' - ');
                            name = parts[0].trim();
                            detail = parts.slice(1).join(' - ').trim();
                        }

                        return { name, detail, phone };
                    });
                
                renderList();
            } catch (error) {
                document.getElementById('listContent').innerHTML = `
                    <div class="p-10 text-center text-[#8e8e93]">
                        <p class="font-bold text-red-500">Rehber Yüklenemedi!</p>
                        <p class="text-xs mt-2">${error.message}</p>
                    </div>`;
                document.getElementById('contactCount').textContent = "HATA";
                console.error(error);
            }
        }

        function normalizeText(text) {
            return text
                .toString()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, "")
                .replace(/İ/g, "i").replace(/I/g, "i").replace(/ı/g, "i")
                .toLowerCase()
                .replace(/[ğ]/g, "g").replace(/[ü]/g, "u").replace(/[ş]/g, "s")
                .replace(/[ö]/g, "o").replace(/[ç]/g, "c");
        }

        function renderList() {
            const listContent = document.getElementById('listContent');
            const searchInput = document.getElementById('searchInput').value;
            const normalizedSearch = normalizeText(searchInput);
            
            const filtered = contacts.filter(c => {
                const fullName = c.detail ? `${c.name} ${c.detail}` : c.name;
                const nameMatch = normalizeText(fullName).includes(normalizedSearch);
                const phoneMatch = c.phone.toString().includes(normalizedSearch);
                return nameMatch || phoneMatch;
            }).sort((a, b) => a.name.localeCompare(b.name, 'tr'));

            document.getElementById('contactCount').textContent = `${filtered.length} KİŞİ BULUNDU`;
            
            let html = '';
            let lastLetter = '';

            filtered.forEach((c) => {
                const letter = (c.name[0] || '#').toUpperCase();
                if (letter !== lastLetter) {
                    html += `<div class="px-2 py-0.5 text-[10px] font-bold text-[#8e8e93] sticky top-0 bg-[#f2f2f7]/95 backdrop-blur-sm z-10">${letter}</div>`;
                    lastLetter = letter;
                }
                
                const aramaLinki = `tel:${sabitSantralNo},,${c.phone}`;
                const detailBadge = c.detail ? `<span class="text-[#007aff] font-medium bg-blue-50 px-1.5 py-0.5 rounded text-[11px] ml-1">${c.detail}</span>` : '';

                const nameLength = c.name.length;
                let nameSizeClass = "text-[13px]";
                if (nameLength > 28) {
                    nameSizeClass = "text-[11px]";
                } else if (nameLength > 20) {
                    nameSizeClass = "text-[12px]";
                }

                html += `
                    <a href="${aramaLinki}" class="block bg-white rounded-xl mb-1.5 shadow-sm active:scale-[0.98] transition-transform no-underline">
                        <div class="flex items-center gap-3 p-3">
                            <div class="w-8 h-8 rounded-full flex items-center justify-center text-white font-bold text-xs shrink-0 shadow-sm" style="background:${getAvatarColor(c.name)}">
                                ${c.name.charAt(0).toUpperCase()}
                            </div>
                            <div class="min-w-0 flex-1">
                                <div class="text-[#1c1c1e] font-bold ${nameSizeClass} leading-tight truncate">${c.name}</div>
                                <div class="flex items-center flex-wrap gap-1 mt-1">
                                    <span class="inline-flex items-center bg-emerald-50 text-emerald-700 font-extrabold text-[12px] px-1.5 py-0.5 rounded border border-emerald-100">
                                        Dahili: ${c.phone}
                                    </span>
                                    ${detailBadge}
                                </div>
                            </div>
                            <div class="ml-auto text-[#34c759] shrink-0 bg-green-50 p-1.5 rounded-full">
                                <i data-lucide="phone-forwarded" class="w-4 h-4"></i>
                            </div>
                        </div>
                    </a>`;
            });
            
            listContent.innerHTML = html || '<div class="p-10 text-center text-[#8e8e93]">Eşleşme bulunamadı</div>';
            lucide.createIcons();
        }

        function getAvatarColor(name) {
            const colors = ['#007aff','#34c759','#ff3b30','#ff9500','#af52de','#5856d6','#ff2d55'];
            let hash = 0;
            for (let i = 0; i < (name || "").length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return colors[Math.abs(hash) % colors.length];
        }

        document.getElementById('searchInput').oninput = renderList;
        loadData();
    </script>
</body>
</html>
